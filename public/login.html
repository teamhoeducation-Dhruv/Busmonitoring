<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Transportation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="Emblem.png">
</head>
<body>
    <div class="app-header">
        <img src="./Emblem.png" alt="Logo">
        <div class="header-title">
            <h1>Commissionerate of Tribal Development</h1>
            <h2>Government of Gujarat</h2>
        </div>
    </div>
    <div class="login-page">
        <div class="login-container">
            <form id="login-form">
                <h1>Login</h1>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" id="login-button" class="button-primary">Login</button>
                <p id="login-error" class="error-message"></p>
                <p class="register-text">New School? <a href="register.html">Create an account</a></p>
            </form>
        </div>
    </div>
    <script src="login.js" type="module"></script>
</body>
</html>
